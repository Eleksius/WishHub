<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WishHub — Вход</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:linear-gradient(135deg,#6366f1 0%,#4f46e5 40%,#06b6d4 100%); }
.login-card { background:#fff; border-radius:24px; padding:2.5rem; width:100%; max-width:400px;
              box-shadow:0 20px 60px rgba(79,70,229,.3); }
.login-logo { font-size:3rem; text-align:center; margin-bottom:.5rem; }
.login-title { font-weight:800; text-align:center; font-size:1.5rem; margin-bottom:.3rem; }
.login-sub { text-align:center; color:#64748b; font-size:.9rem; margin-bottom:2rem; }
.input-w { border-radius:12px; border:1.5px solid #e2e8f0; background:#f8fafc; padding:12px 14px;
           width:100%; font-family:inherit; font-size:.95rem; transition:all .2s; outline:none; }
.input-w:focus { background:#fff; border-color:#6366f1; box-shadow:0 0 0 4px rgba(99,102,241,.1); }
.lbl { font-weight:600; font-size:.82rem; color:#64748b; text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block; }
.btn-login { width:100%; border-radius:12px; border:none; padding:13px;
             background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff;
             font-weight:700; font-size:1rem; cursor:pointer; transition:all .2s;
             box-shadow:0 4px 16px rgba(99,102,241,.35); }
.btn-login:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(99,102,241,.45); }
.alert { border:none; border-radius:10px; padding:12px 16px; font-size:.9rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">🎁</div>
  <h1 class="login-title">WishHub</h1>
  <p class="login-sub">Семейный вишлист</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ 'danger' if category=='error' else category }} mb-3">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="lbl">Логин</label>
      <input type="text" name="username" class="input-w" placeholder="Введи логин" required autofocus>
    </div>
    <div class="mb-4">
      <label class="lbl">Пароль</label>
      <input type="password" name="password" class="input-w" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">
      Войти <i class="bi bi-arrow-right-short"></i>
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
