{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-4">
        <div class="card-modern p-4 border-0">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="fs-1">🎁</span>
                    <h3 class="fw-bold mt-2">Вход в WishHub</h3>
                    <p class="text-muted small">Войдите по выданному логину и паролю</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Логин</label>
                        <input type="text" name="username" class="form-control form-control-modern" placeholder="Введите ваш логин" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted">Пароль</label>
                        <input type="password" name="password" class="form-control form-control-modern" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-modern w-100 shadow-sm py-3">Войти в систему</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
